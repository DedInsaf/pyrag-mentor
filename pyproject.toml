[project]
name = "pyrag-mentor"
version = "0.2.0"
description = "Multi-agent RAG assistant for beginner Python 3.12 learners"
authors = [{ name = "Student", email = "student@example.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
python-dotenv = ">=1.0,<2.0"
pydantic-settings = ">=2.5,<3.0"
httpx = ">=0.27,<1.0"
sqlalchemy = ">=2.0,<3.0"
asyncpg = ">=0.29,<1.0"
aiosqlite = ">=0.20,<1.0"
python-multipart = ">=0.0.9,<1.0"
passlib = { version = ">=1.7.4,<2.0", extras = ["bcrypt"] }
python-jose = { version = ">=3.3,<4.0", extras = ["cryptography"] }
email-validator = ">=2.2,<3.0"
celery = ">=5.4,<6.0"
redis = ">=5.0,<7.0"
qdrant-client = ">=1.11,<2.0"
sentence-transformers = ">=3.0,<6.0"
transformers = ">=4.44,<6.0"
torch = ">=2.4,<3.0"
sentencepiece = ">=0.2,<1.0"
sacrebleu = ">=2.4,<3.0"
bert-score = ">=0.3.13,<1.0"
evaluate = ">=0.4,<1.0"
rank-bm25 = ">=0.2.2,<1.0"
nltk = ">=3.9,<4.0"
python-json-logger = ">=2.0,<4.0"
psycopg2-binary = ">=2.9,<3.0"
streamlit = ">=1.38,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10.0"
pytest-asyncio = ">=0.24,<2.0"
pytest-cov = ">=5.0,<8.0"
pytest-mock = ">=3.14,<4.0"
black = ">=24.8,<27.0"
mypy = ">=1.11,<2.0"
ruff = ">=0.6,<1.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --cov=backend --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
